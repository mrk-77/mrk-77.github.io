<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050b14">
  <meta name="color-scheme" content="dark light">
  {% seo %}
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div class="site-bg" aria-hidden="true"></div>

  <header class="site-header">
    <div class="nav-wrap">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="Mreza Dev home">
        <span class="brand-mark" aria-hidden="true">✦</span>
        <span><strong>MREZA DEV</strong><small>Security Research &amp; Engineering</small></span>
      </a>

      <nav class="nav" id="siteNav" aria-label="Primary navigation">
        <a href="{{ '/' | relative_url }}" class="{% if page.url == '/' %}active{% endif %}">Home</a>
        <a href="{{ '/blog/' | relative_url }}" class="{% if page.url contains '/blog' %}active{% endif %}">Blog</a>
        <a href="{{ '/research/' | relative_url }}" class="{% if page.url == '/research/' %}active{% endif %}">Research</a>
        <a href="{{ '/writeups/' | relative_url }}" class="{% if page.url == '/writeups/' %}active{% endif %}">Writeups</a>
        <a href="{{ '/projects/' | relative_url }}" class="{% if page.url == '/projects/' %}active{% endif %}">Projects</a>
        <a href="{{ '/about/' | relative_url }}" class="{% if page.url == '/about/' %}active{% endif %}">About</a>
        <a href="{{ '/resources/' | relative_url }}" class="{% if page.url == '/resources/' %}active{% endif %}">Resources</a>
      </nav>

      <div class="nav-actions">
        <button id="themeToggle" class="icon-btn" type="button" aria-label="Switch to light theme" aria-pressed="false"><span aria-hidden="true">☾</span></button>
        <a class="github-btn" href="https://github.com/mrk-77" target="_blank" rel="noopener noreferrer">GitHub</a>
        <button id="menuToggle" class="menu-btn" type="button" aria-label="Open menu" aria-controls="siteNav" aria-expanded="false"><span aria-hidden="true">☰</span></button>
      </div>
    </div>
  </header>

  <main id="main-content" class="site-main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div>© {{ site.time | date: "%Y" }} Mreza Dev.</div>
      <div>Built with <span class="heart">♥</span> and lots of ☕</div>
      <div class="footer-links">
        <a href="{{ '/about/' | relative_url }}">About</a>
        <a href="{{ '/security.txt' | relative_url }}">Security.txt</a>
        <a href="{{ '/sitemap.xml' | relative_url }}">Sitemap</a>
        <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      </div>
    </div>
  </footer>

  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>
